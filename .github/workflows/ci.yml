name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build TinyFlags.slnx -warnaserror
      - run: dotnet test TinyFlags.slnx -warnaserror
      - name: Verify the packaged generator (real pack -> restore -> build -> run)
        shell: pwsh
        run: ./tests/TinyFlags.PackageTests/Verify-Package.ps1
