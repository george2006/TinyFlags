services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: tinyflags
      POSTGRES_USER: tinyflags
      POSTGRES_PASSWORD: tinyflags-sample
    ports:
      - "127.0.0.1:54326:5432"
    volumes:
      - tinyflags-sample-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyflags -d tinyflags"]
      interval: 2s
      timeout: 5s
      retries: 15

  # TinyFlags clients require HTTPS or a loopback endpoint — a deliberate guard against leaking an
  # API key over plain HTTP to a non-local host. orders-service and payments-service below share
  # this container's network namespace so "http://localhost" is genuinely correct for them, not a
  # bypass of that check. Their ports are declared here for the same reason.
  #
  # This pulls the published TinyFlags.Server image rather than building from source — the server
  # lives in its own repo now (github.com/george2006/TinyFlags.Server). TinyFlags__License is a
  # real, time-limited evaluation license (expires ~2026-09-28); replace it with your own once it
  # expires, requested from TinyBoutique. Without a valid license the server refuses to start.
  tinyflags-server:
    image: ghcr.io/george2006/tinyflags-server:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TinyFlags: "Host=postgres;Port=5432;Database=tinyflags;Username=tinyflags;Password=tinyflags-sample"
      TinyFlags__License: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJqZHVyYmFuQGdtYWlsLmNvbSIsIm5iZiI6MTc5MDAxNTEwNCwiZXhwIjoxNzkwNjE5OTA0LCJpYXQiOjE3OTAwMTUxMDR9.P04LFx5lyC8gM2ZTRkRCqIJKGJtWSsmhcwpBLscerbw4eg9mM-bNzf_dEdhENTnAvoiTEOdVNltpK7kVfbxst1vCofgHKXBw508ftX_uqNa1YBegZwCWOONhwRcVXWOrnW4Nfq-qcvzFzGeyWqwHzgW6fgZlb92rWKRfLnqZTg6xoALHEZOle9G34RPzhqXHMrzlDRSIPej7N5wcD8oqf7VLvv_YveNDRUHQFapYzip5RJOcDfzQfae_iQjqAm4nbITe7OkSUSb5XnMpA7Cn_ezbWxX-0WR2-2fCkxTrhq-E7BIzQKhfswz3KZASQIIkIfFRC2-PG6UCmM4B1CPwHw"
    ports:
      - "127.0.0.1:8085:8080" # TinyFlags.Server itself / the admin dashboard
      # TinyFlags.Server also binds 8081 itself (its own gRPC listener, always on, unrelated to
      # this HTTP-only sample) - orders-service uses 8083 instead of 8081 to avoid colliding with
      # it inside this shared network namespace. Host-side port (8090) is unaffected.
      - "127.0.0.1:8090:8083" # orders-service
      - "127.0.0.1:8091:8082" # payments-service
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: migrates the database, creates a project/environment/client key, and issues an
  # admin token — writing the two secrets to a shared volume instead of a console you'd copy from.
  # Runs once per `docker compose up`, then exits; orders-service and payments-service wait for it.
  # CLI commands (--migrate, --seed-development, --issue-admin-key) never need a license — only
  # the running web server does, so this service doesn't set TinyFlags__License.
  bootstrap:
    image: ghcr.io/george2006/tinyflags-server:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TinyFlags: "Host=postgres;Port=5432;Database=tinyflags;Username=tinyflags;Password=tinyflags-sample"
    volumes:
      - tinyflags-sample-keys:/keys
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Both commands log EF Core activity to stdout alongside the secret they print last, so
      # keep only the final line — the secret — not the whole console transcript. The client key
      # only needs to reach the other two containers; the admin key is also `tee`'d back to this
      # container's own stdout, since a human needs to read it (`docker compose logs bootstrap`).
      - "dotnet TinyFlags.Server.dll --migrate && dotnet TinyFlags.Server.dll --environment Development --seed-development | tail -n 1 > /keys/client.key && dotnet TinyFlags.Server.dll --environment Development --issue-admin-key --label Sample | tail -n 1 | tee /keys/admin.key"
    depends_on:
      postgres:
        condition: service_healthy

  orders-service:
    build:
      context: ../../.
      dockerfile: samples/MultiServiceHttp/OrdersService/Dockerfile
    network_mode: "service:tinyflags-server"
    environment:
      ASPNETCORE_URLS: "http://+:8083"
      TinyFlags__Endpoint: "http://localhost:8080"
    volumes:
      - tinyflags-sample-keys:/keys:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      tinyflags-server:
        condition: service_started

  payments-service:
    build:
      context: ../../.
      dockerfile: samples/MultiServiceHttp/PaymentsService/Dockerfile
    network_mode: "service:tinyflags-server"
    environment:
      ASPNETCORE_URLS: "http://+:8082"
      TinyFlags__Endpoint: "http://localhost:8080"
    volumes:
      - tinyflags-sample-keys:/keys:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      tinyflags-server:
        condition: service_started

volumes:
  tinyflags-sample-db:
  tinyflags-sample-keys:
